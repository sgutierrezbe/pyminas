<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Phase 1 Test Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 p-8">
  <!-- Minimal UI containers needed by app.js -->
  <div id="view-login" class="hidden"></div>
  <div id="view-dashboard" class="hidden">
    <div id="course-intro-card"></div>
    <div id="game-map-container"></div>
    <div id="nav-streak-badge"></div>
    <div id="nav-user-profile"></div>
    <div id="unit-nodes-container"></div>
    <div id="nav-xp-badge">
      <span id="nav-level-icon"></span>
      <span id="nav-level-title"></span>
      <span id="nav-xp-text"></span>
    </div>
  </div>

  <div id="tour-spotlight-overlay" class="hidden fixed inset-0">
    <div id="tour-backdrop-catcher"></div>
    <div id="tour-spotlight-box"></div>
    <div id="tour-mascot-dialog">
      <span id="tour-step-badge"></span>
      <h3 id="tour-step-title"></h3>
      <p id="tour-step-desc"></p>
      <div id="tour-dots-indicator"></div>
      <button id="tour-prev-btn" class="hidden"></button>
      <button id="tour-skip-btn"></button>
      <button id="tour-next-btn"></button>
    </div>
  </div>
  <div id="view-lesson" class="hidden">
    <header>
      <button id="lesson-prev-step-btn" class="hidden"></button>
      <span id="lesson-header-title"></span>
      <div id="lesson-segments-container"></div>
      <div id="lesson-xp-badge">
        <span id="lesson-level-icon"></span>
        <span id="lesson-xp-text"></span>
      </div>
      <div id="lesson-streak-badge"><span id="lesson-streak-text"></span></div>
    </header>
    <main id="lesson-content-area"></main>
  </div>
  <div id="start-lesson-modal" class="hidden">
    <h3 id="start-modal-title"></h3>
    <p id="start-modal-desc"></p>
    <button id="start-modal-btn" onclick="dismissStartModal()"></button>
  </div>
  <div id="victory-lesson-modal" class="hidden">
    <h3 id="victory-modal-title"></h3>
    <div id="victory-xp-counter"></div>
    <div id="victory-precision-counter"></div>
    <div id="victory-streak-counter"></div>
    <div id="victory-first-try-badge"></div>
    <div id="victory-first-try-desc"></div>
    <div id="victory-flawless-badge" class="hidden"></div>
    <div id="victory-level-icon"></div>
    <div id="victory-level-label"></div>
    <div id="victory-level-title"></div>
    <div id="victory-level-xp-text"></div>
    <div id="victory-level-next-text"></div>
    <div id="victory-level-bar"></div>
    <div id="victory-level-up-banner" class="hidden"></div>
    <div id="victory-week-complete-banner" class="hidden"></div>
    <button id="victory-next-btn"></button>
  </div>
  <div id="week-completion-modal" class="hidden">
    <h2 id="week-celebration-title"></h2>
    <p id="week-celebration-subtitle"></p>
    <span id="week-stat-lessons"></span>
    <span id="week-stat-first-try"></span>
    <span id="week-stat-xp"></span>
    <span id="week-badge-title"></span>
    <span id="week-badge-type"></span>
    <button id="week-celebration-next-btn"></button>
  </div>
  <div id="level-info-modal" class="hidden">
    <div id="level-modal-current-card"></div>
    <div id="level-tiers-list"></div>
  </div>
  <div id="lesson-loading-screen" class="hidden">
    <div id="loading-lesson-tag"></div>
    <div id="loading-lesson-title"></div>
    <div id="loading-status-text"></div>
    <div id="loading-progress-bar"></div>
    <div id="loading-percent-label"></div>
    <div id="loading-tip-text"></div>
  </div>

  <div id="test-output" class="bg-white p-6 rounded-2xl border-2 border-slate-300 font-mono text-sm max-w-2xl mx-auto my-8 shadow-md">
    <h1 class="text-xl font-bold mb-4 text-slate-800">Ejecutando Test Suite Fase 1...</h1>
    <div id="log" class="whitespace-pre-wrap space-y-1"></div>
  </div>

  <script src="curriculum.js"></script>
  <script src="baked_traces.js"></script>
  <script>window.FAST_ANIM = true;</script>
  <script src="app.js"></script>

  <script>
    const logEl = document.getElementById('log');
    function log(msg, pass = true) {
      const line = document.createElement('div');
      line.textContent = (pass ? "✓ " : "✗ ") + msg;
      line.className = pass ? "text-emerald-700 font-bold" : "text-rose-600 font-bold";
      logEl.appendChild(line);
      console.log((pass ? "[PASS] " : "[FAIL] ") + msg);
    }

    function assert(cond, msg) {
      if (cond) {
        log(msg, true);
      } else {
        log(msg, false);
        throw new Error("Assertion failed: " + msg);
      }
    }

    async function runTests() {
      try {
        log("Iniciando pruebas de Fase 1...", true);

        // 1. Test Step Persistence
        localStorage.clear();
        localStorage.setItem('pyminas_auth_token', 'test_token');
        currentUser.token = 'test_token';
        savedLessonSteps = {};
        openLessonDirect('w1-l1', 0);
        assert(currentStepIndex === 0, "Paso inicial es 0");
        assert(document.getElementById('lesson-prev-step-btn').classList.contains('hidden'), "Botón anterior oculto en paso 0");

        advanceNextStep();
        assert(currentStepIndex === 1, "Avanza al paso 1");
        assert(!document.getElementById('lesson-prev-step-btn').classList.contains('hidden'), "Botón anterior visible en paso 1");
        assert(getSavedLessonStep('w1-l1') === 1, "localStorage guardó paso 1");

        advanceNextStep();
        assert(currentStepIndex === 2, "Avanza al paso 2");
        assert(getSavedLessonStep('w1-l1') === 2, "localStorage guardó paso 2");

        // Simular salida al mapa y reinicio de lección
        backToDashboard();
        assert(currentStepIndex === 2, "Paso 2 se preserva en estado de memoria");
        assert(getSavedLessonStep('w1-l1') === 2, "Paso 2 se preserva en localStorage tras salir al mapa");

        startLesson('w1-l1');
        assert(currentStepIndex === 2, "startLesson('w1-l1') reanuda correctamente en paso 2");
        dismissStartModal();

        // 2. Test Backward Navigation
        goToPrevStep();
        assert(currentStepIndex === 1, "goToPrevStep() retrocede al paso 1");
        assert(getSavedLessonStep('w1-l1') === 1, "localStorage actualiza a paso 1");

        goToPrevStep();
        assert(currentStepIndex === 0, "goToPrevStep() retrocede al paso 0");
        assert(getSavedLessonStep('w1-l1') === 0, "localStorage actualiza a paso 0");
        assert(document.getElementById('lesson-prev-step-btn').classList.contains('hidden'), "Botón anterior vuelve a ocultarse en paso 0");

        // 3. Test Keyboard Shortcuts: Number selection
        openLessonDirect('w1-l1', 1); // paso 1 es predict
        assert(currentStepIndex === 1, "Abrir paso predict (paso 1)");
        
        window.dispatchEvent(new KeyboardEvent('keydown', { key: '2' }));
        assert(selectedPredictOption === 'B', "Tecla '2' seleccionó opción B");

        window.dispatchEvent(new KeyboardEvent('keydown', { key: '1' }));
        assert(selectedPredictOption === 'A', "Tecla '1' seleccionó opción A");
        window.dispatchEvent(new KeyboardEvent('keydown', { key: '2' }));
        assert(selectedPredictOption === 'B', "Tecla '2' seleccionó opción correcta B");

        // 4. Test Keyboard Shortcut: Enter to check
        window.FAST_ANIM = true;
        console.log("ABOUT TO PRESS ENTER, predictCheckBtn:", document.getElementById("predict-check-btn") ? document.getElementById("predict-check-btn").outerHTML : "null"); window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
        let waits = 0; while (!predictStepPassed && waits++ < 20) { await new Promise(r => setTimeout(r, 50)); }
        assert(predictStepPassed === true, "Tecla Enter ejecutó Comprobar y aprobó predicción");

        // 5. Test Keyboard Shortcut: Enter to continue
        console.log("ABOUT TO PRESS ENTER, predictCheckBtn:", document.getElementById("predict-check-btn") ? document.getElementById("predict-check-btn").outerHTML : "null"); window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
        assert(currentStepIndex === 2, "Tecla Enter avanzó al siguiente paso tras aprobación");

        // 6. Test Keyboard Shortcut: ArrowRight/ArrowLeft steps code player in explanation step
        const pid = "expl_" + currentStepIndex;
        const playerBefore = codePlayerRegistry[pid] ? codePlayerRegistry[pid].currentIndex : -1;
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
        const playerAfter = codePlayerRegistry[pid] ? codePlayerRegistry[pid].currentIndex : -1;
        assert(playerAfter > playerBefore, "Tecla ArrowRight avanzó línea en el reproductor de código");

        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
        const playerBack = codePlayerRegistry[pid] ? codePlayerRegistry[pid].currentIndex : -1;
        assert(playerBack <= playerAfter, "Tecla ArrowLeft retrocedió línea en el reproductor de código");

        // 7. Test Guided Sandbox terminal styling & number selection
        openLessonDirect('w1-l1', 5); // paso 5 es code_sandbox guiado
        assert(currentStepIndex === 5, "Abrir paso code_sandbox (paso 5)");
        
        const termEl = document.getElementById('single-sandbox-term');
        assert(termEl !== null, "Terminal de sandbox renderizada");
        assert(termEl.className.includes('text-[#34d399]'), "Terminal tiene color de texto esmeralda unificado #34d399");

        window.dispatchEvent(new KeyboardEvent('keydown', { key: '1' }));
        assert(selectedGuidedOptionId === 'A', "Tecla '1' seleccionó opción A en sandbox guiado");

        const slotEl = document.getElementById('guided-code-slot');
        assert(slotEl && slotEl.textContent.includes('print'), "Slot rellenado con la opción A");

        // Ejecutar código vía Enter
        console.log("ABOUT TO PRESS ENTER, predictCheckBtn:", document.getElementById("predict-check-btn") ? document.getElementById("predict-check-btn").outerHTML : "null"); window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
        let gwaits = 0; while (!guidedStepCompleted && gwaits++ < 20) { await new Promise(r => setTimeout(r, 50)); }
        assert(guidedStepCompleted === true, "Sandbox guiado completado con éxito vía Enter");

        // Enter para finalizar lección
        console.log("ABOUT TO PRESS ENTER, predictCheckBtn:", document.getElementById("predict-check-btn") ? document.getElementById("predict-check-btn").outerHTML : "null"); window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
        assert(currentStepIndex >= currentLesson.steps.length, "Tecla Enter finalizó la lección y abrió modal de victoria");
        assert(getSavedLessonStep('w1-l1') === 0, "Al finalizar lección, savedLessonSteps se reinició a 0 para futuros repasos");

        // 8. Test Terminal Console Placement below Code Editor
        openLessonDirect('w1-l1', 0); // paso 0 es explicación con code player
        const editorBox = document.getElementById('code-lines-expl_0');
        const termBox = document.getElementById('code-terminal-expl_0');
        assert(editorBox !== null, "Editor de código renderizado en reproductor");
        assert(termBox !== null, "Consola terminal renderizada en reproductor");
        assert((editorBox.compareDocumentPosition(termBox) & Node.DOCUMENT_POSITION_FOLLOWING) !== 0, "Consola de salida ubicada DEBAJO del editor de código");

        // 9. Test Weekly Streak Logic
        assert(typeof getMondayString === 'function', "Función getMondayString disponible");
        const monday1 = getMondayString(new Date('2026-09-02')); // Miércoles
        const monday2 = getMondayString(new Date('2026-09-06')); // Domingo misma semana
        const monday3 = getMondayString(new Date('2026-09-08')); // Martes semana siguiente
        assert(monday1 === monday2, "Misma semana genera el mismo lunes identificador");
        assert(getWeekDiff(monday1, monday3) === 1, "Semana siguiente calcula diferencia exacta de 1 semana");
        assert(getWeekDiff(monday1, getMondayString(new Date('2026-09-20'))) === 2, "Dos semanas de diferencia calcula diff=2");

        // Test streak increment upon lesson completion
        currentUser.weeklyStreak = 0;
        currentUser.lastActiveWeek = '';
        recordLessonCompletionStreak();
        assert(currentUser.weeklyStreak === 1, "Completar lección por primera vez inicia racha en 1 semana");
        assert(currentUser.lastActiveWeek === getMondayString(), "Registra la semana actual");
        assert(getEffectiveWeeklyStreak() === 1, "Racha efectiva es 1");

        // Simular que la semana anterior tenía racha 2 y hoy completa otra
        currentUser.weeklyStreak = 2;
        currentUser.lastActiveWeek = getMondayString(new Date(Date.now() - 7 * 86400000));
        recordLessonCompletionStreak();
        assert(currentUser.weeklyStreak === 3, "Completar lección en semana consecutiva incrementa la racha a 3");

        // Simular que pasaron 3 semanas sin actividad (racha rota)
        currentUser.weeklyStreak = 5;
        currentUser.lastActiveWeek = getMondayString(new Date(Date.now() - 21 * 86400000));
        assert(getEffectiveWeeklyStreak() === 0, "Racha se muestra en 0 si pasaron más de 1 semana sin entrar");
        recordLessonCompletionStreak();
        assert(currentUser.weeklyStreak === 1, "Al retomar tras semanas inactivo, la racha se reinicia en 1");
        updateStreakDisplay();
        assert(document.getElementById('lesson-streak-text').textContent === '1 sem', "Badge de racha semanal en pantalla de ejercicios muestra '1 sem'");

        // 10. Test Auto-Scroll to Code Window (ensureCodeVisible)
        assert(typeof ensureCodeVisible === 'function', "Función ensureCodeVisible disponible");
        const codeWrapper = document.getElementById('code-player-wrapper-expl_0');
        assert(codeWrapper !== null, "Contenedor completo del reproductor de código presente (editor + terminal)");
        ensureCodeVisible('code-player-wrapper-expl_0');
        assert(true, "ensureCodeVisible se ejecuta correctamente para encuadrar la ventana de código");

        // 11. Test New Account starts with 0 completed lessons
        localStorage.removeItem('py101_completed_lessons');
        assert(Array.isArray(completedLessons), "completedLessons es un arreglo");
        completedLessons = [];
        assert(completedLessons.length === 0, "Cuenta nueva arranca con 0 lecciones completadas");

        // 12. Test Interactive Spotlight Tour (pyMinas snake mascot)
        assert(Array.isArray(TOUR_STEPS) && TOUR_STEPS.length === 4, "TOUR_STEPS contiene exactamente 4 pasos temáticos");
        assert(TOUR_STEPS[0].targetId === 'course-intro-card', "Paso 1 enfoca tarjeta de bienvenida");
        assert(TOUR_STEPS[1].targetId === 'game-map-container', "Paso 2 enfoca mapa de niveles");
        assert(TOUR_STEPS[2].targetId === 'nav-streak-badge', "Paso 3 enfoca racha semanal");
        assert(TOUR_STEPS[3].targetId === 'nav-user-profile', "Paso 4 enfoca cuenta y credenciales");

        startInteractiveTour(true);
        assert(isTourActive === true, "startInteractiveTour activó el recorrido");
        assert(tourCurrentStep === 0, "Paso inicial es 0");
        assert(document.getElementById('tour-step-title').textContent.includes('Bienvenido'), "Título de bienvenida en paso 0");

        nextTourStep();
        assert(tourCurrentStep === 1, "nextTourStep avanzó a paso 1 (Niveles)");
        assert(document.getElementById('tour-step-title').textContent.includes('Niveles'), "Título de niveles en paso 1");

        nextTourStep();
        assert(tourCurrentStep === 2, "nextTourStep avanzó a paso 2 (Racha)");
        assert(document.getElementById('tour-step-title').textContent.includes('Racha'), "Título de racha en paso 2");

        nextTourStep();
        assert(tourCurrentStep === 3, "nextTourStep avanzó a paso 3 (Credenciales)");
        assert(document.getElementById('tour-step-title').textContent.includes('Credenciales'), "Título de credenciales en paso 3");

        prevTourStep();
        assert(tourCurrentStep === 2, "prevTourStep retrocedió a paso 2");

        dismissTour();
        assert(isTourActive === false, "dismissTour cerró el tour");
        assert(localStorage.getItem('pyminas_tour_completed') === 'true', "dismissTour registró tour completado en localStorage");

        // 13. Test Interactive input() execution in Code Player (w1-l2 step 0)
        window.FAST_ANIM = false;
        openLessonDirect('w1-l2', 0);
        assert(currentStepIndex === 0, "Abrir w1-l2 paso 0 (input explicativo)");
        const inputPid = "expl_0";
        assert(codePlayerRegistry[inputPid] !== undefined, "CodePlayer inicializado para w1-l2");
        assert(codePlayerRegistry[inputPid].lines[0].includes('input'), "Línea 0 contiene llamada a input()");

        codePlayerTogglePlay(inputPid);
        assert(codePlayerRegistry[inputPid].currentIndex === 0, "CodePlayer se detiene exactamente en línea 0 para input");
        assert(codePlayerRegistry[inputPid].isPlaying === false, "isPlaying se pausa en espera del usuario");
        assert(codePlayerRegistry[inputPid].wasAutoPlaying === true, "wasAutoPlaying registrado para reanudar");

        const termInputBox = document.getElementById(`term-input-box-${inputPid}`);
        assert(termInputBox !== null, "Campo de entrada interactiva renderizado en terminal");

        termInputBox.value = "Sara";
        handleTerminalInputSubmit(inputPid, 0);

        let iwaits = 0;
        while (!codePlayerRegistry[inputPid] || codePlayerRegistry[inputPid].currentIndex < 1) {
          if (iwaits++ > 60) break;
          await new Promise(r => setTimeout(r, 50));
        }

        const terminalOutput = document.getElementById(`code-terminal-${inputPid}`).textContent;
        assert(terminalOutput.includes('Sara'), "Salida de terminal incluye el nombre ingresado 'Sara'");
        assert(terminalOutput.includes('¡Mucho gusto, Sara'), "Segunda línea se ejecutó con la variable 'Sara' correctamente");

        const continueBtn = document.getElementById('explanation-continue-btn');
        assert(continueBtn && !continueBtn.disabled, "Botón Continuar desbloqueado tras completar ejecución con input");

        // 14. Test APP_VERSION constant
        assert(window.APP_VERSION === 'v1.38', "APP_VERSION está actualizado a v1.38");

        // 15. Test Semana 2 curriculum presence and navigation
        assert(CURRICULUM.weeks.length === 2, "CURRICULUM contiene exactamente 2 semanas");
        assert(CURRICULUM.weeks[1].id === 'semana-2', "Semana 2 tiene id 'semana-2'");
        assert(CURRICULUM.weeks[1].lessons.length === 6, "Semana 2 contiene exactamente 6 niveles");
        
        openLessonDirect('w2-l1', 0);
        assert(currentLesson.id === 'w2-l1', "w2-l1 (Comparadores) abre correctamente");
        assert(currentStepIndex === 0, "Paso inicial de w2-l1 es 0");
        const w2ExplPid = "expl_0";
        assert(codePlayerRegistry[w2ExplPid] !== undefined, "CodePlayer inicializado para w2-l1");

        // 16. Test ligaduras tipográficas desactivadas para comparadores Python (==, !=, <=, >=)
        const testCodeEl = document.createElement('code');
        testCodeEl.className = 'font-mono';
        testCodeEl.textContent = '== !=';
        document.body.appendChild(testCodeEl);
        const codeStyle = window.getComputedStyle(testCodeEl);
        const ligatures = codeStyle.fontVariantLigatures || codeStyle.getPropertyValue('font-variant-ligatures');
        assert(ligatures === 'none', "Ligaduras tipográficas desactivadas (font-variant-ligatures: none)");
        document.body.removeChild(testCodeEl);

        // 17. Test indentación de 4 espacios en CodePlayer (w2-l3 paso 0)
        openLessonDirect('w2-l3', 0);
        const w2l3Pid = "expl_0";
        assert(codePlayerRegistry[w2l3Pid] !== undefined, "CodePlayer inicializado para w2-l3");
        const line3El = document.querySelector(`#code-line-${w2l3Pid}-2 .code-line-text`);
        assert(line3El !== null, "Línea 3 de código encontrada");
        const styleLine3 = window.getComputedStyle(line3El);
        assert(styleLine3.whiteSpace === 'pre', "white-space es 'pre' para preservar la indentación");
        assert(line3El.textContent.startsWith('    '), "Línea 3 preserva 4 espacios de sangría al inicio");

        // 18. Test interactivo de bifurcación condicional (w2-l5) con entradas dinámicas
        const codeW2L5 = `nota = float(input("Ingresa tu nota final (0.0 a 5.0): "))
if nota >= 3.0:
    print("¡Felicitaciones! Has aprobado")
else:
    print("Reprobado, debes habilitar")
print("Cierre del periodo académico")`;

        // Caso A: Nota aprobatoria (4.2)
        const traceAprob = tracePythonExecution(codeW2L5, "", { 0: "4.2" });
        assert(traceAprob.lineTrace[0].userValue === "4.2", "Input capturado como 4.2");
        assert(traceAprob.lineTrace[2].skipped !== true, "Línea de aprobado ejecutada");
        assert(traceAprob.lineTrace[4].skipped === true, "Línea de else omitida");
        const outAprob = traceAprob.lineTrace[traceAprob.lineTrace.length - 1].outputSoFar.join('\n');
        assert(outAprob.includes("¡Felicitaciones! Has aprobado"), "Salida contiene mensaje de aprobado");
        assert(!outAprob.includes("Reprobado"), "Salida NO contiene mensaje de reprobado");

        // Caso B: Nota reprobatoria (2.0)
        const traceReprob = tracePythonExecution(codeW2L5, "", { 0: "2.0" });
        assert(traceReprob.lineTrace[0].userValue === "2.0", "Input capturado como 2.0");
        assert(traceReprob.lineTrace[2].skipped === true, "Línea de aprobado omitida");
        assert(traceReprob.lineTrace[4].skipped !== true, "Línea de else ejecutada");
        const outReprob = traceReprob.lineTrace[traceReprob.lineTrace.length - 1].outputSoFar.join('\n');
        assert(!outReprob.includes("¡Felicitaciones! Has aprobado"), "Salida NO contiene mensaje de aprobado");
        assert(outReprob.includes("Reprobado, debes habilitar"), "Salida contiene mensaje de reprobado");

        // 19. Test funciones de validación de entradas de Python (validatePythonInputValue)
        const vIntDientes = validatePythonInputValue('edad = int(input("Ingresa tu edad: "))', 'dientes');
        assert(vIntDientes.valid === false, "Validación rechaza 'dientes' para int(input)");
        assert(vIntDientes.message.includes("no es un número entero válido"), "Mensaje de error pedagógico claro para entero");

        const vIntFloat = validatePythonInputValue('edad = int(input("Ingresa tu edad: "))', '14.5');
        assert(vIntFloat.valid === false, "Validación rechaza '14.5' para int(input)");
        assert(vIntFloat.message.includes("sin decimales"), "Mensaje de error alerta que debe ser sin decimales");

        const vIntOk = validatePythonInputValue('edad = int(input("Ingresa tu edad: "))', '14');
        assert(vIntOk.valid === true, "Validación aprueba '14' para int(input)");

        const vFloatComma = validatePythonInputValue('nota = float(input("Nota: "))', '4,2');
        assert(vFloatComma.valid === false, "Validación detecta uso de coma en vez de punto para decimales");
        assert(vFloatComma.message.includes("punto (.)"), "Mensaje de error enseña la regla de Python sobre el punto decimal");

        const vFloatOk = validatePythonInputValue('nota = float(input("Nota: "))', '4.2');
        assert(vFloatOk.valid === true, "Validación aprueba '4.2' para float(input)");

        // 20. Test interactivo en UI: rechazo de 'dientes' en w2-l4 y desbloqueo con valor numérico válido
        window.FAST_ANIM = false;
        openLessonDirect('w2-l4', 0);
        const w2l4Pid = "expl_0";
        assert(codePlayerRegistry[w2l4Pid] !== undefined, "CodePlayer w2-l4 inicializado");
        codePlayerTogglePlay(w2l4Pid);
        assert(codePlayerRegistry[w2l4Pid].currentIndex === 0, "Detenido en línea 0 para entrada de edad");

        const w2l4InputBox = document.getElementById(`term-input-box-${w2l4Pid}`);
        const w2l4ErrEl = document.getElementById(`term-input-err-${w2l4Pid}`);
        assert(w2l4InputBox !== null, "Campo de entrada edad presente");
        assert(w2l4ErrEl !== null, "Contenedor de error de entrada presente");

        // Intentar enviar "dientes"
        w2l4InputBox.value = "dientes";
        handleTerminalInputSubmit(w2l4Pid, 0);

        assert(!w2l4ErrEl.classList.contains('hidden'), "Contenedor de error visible tras ingresar 'dientes'");
        assert(w2l4ErrEl.textContent.includes("no es un número entero válido"), "Alerta visual en terminal indica que 'dientes' es inválido");
        assert(!codePlayerRegistry[w2l4Pid].userInputs || !codePlayerRegistry[w2l4Pid].userInputs[0], "No se registraron inputs inválidos en el player");

        // Ahora ingresar un entero válido (14)
        w2l4InputBox.value = "14";
        handleTerminalInputSubmit(w2l4Pid, 0);

        assert(w2l4ErrEl.classList.contains('hidden'), "Contenedor de error oculto tras ingresar número válido");
        assert(codePlayerRegistry[w2l4Pid].userInputs[0] === "14", "Input '14' aceptado y almacenado");

        window.FAST_ANIM = true;
        let w2l4Waits = 0;
        while (!codePlayerRegistry[w2l4Pid] || codePlayerRegistry[w2l4Pid].currentIndex < 5) {
          if (w2l4Waits++ > 60) break;
          await new Promise(r => setTimeout(r, 50));
        }
        const finalTermOut = document.getElementById(`code-terminal-${w2l4Pid}`).textContent;
        assert(finalTermOut.includes("Descuento del 5% aplicado"), "Con edad 14 se aplicó el descuento correctamente");
        assert(finalTermOut.includes("Total a pagar: $ 4750"), "Total a pagar calcula 4750 con descuento");

        // 21. Test Sistema de Niveles y Rangos UNAL (LEVEL_TIERS & getUserLevelInfo)
        assert(Array.isArray(window.LEVEL_TIERS) && window.LEVEL_TIERS.length === 9, "LEVEL_TIERS contiene los 9 rangos de ingeniería UNAL");
        assert(window.LEVEL_TIERS[0].title === 'Novato de Minas' && window.LEVEL_TIERS[0].icon === '⛏️', "Nivel 1 es Novato de Minas ⛏️");
        assert(window.LEVEL_TIERS[1].title === 'Explorador de Código' && window.LEVEL_TIERS[1].icon === '🧭', "Nivel 2 es Explorador de Código 🧭");
        assert(window.LEVEL_TIERS[8].title === 'Leyenda de la Facultad de Minas' && window.LEVEL_TIERS[8].icon === '👑', "Nivel 9 es Leyenda de la Facultad de Minas 👑");

        const lvl0 = getUserLevelInfo(0);
        assert(lvl0.level === 1 && lvl0.percent === 0, "0 XP corresponde a Nivel 1 con 0% de progreso");
        assert(lvl0.xpNeeded === 121, "Faltan 121 XP para Nivel 2 desde 0 XP");

        const lvl1Max = getUserLevelInfo(120);
        assert(lvl1Max.level === 1 && lvl1Max.percent === 100, "120 XP completa el 100% de la barra del Nivel 1");
        assert(lvl1Max.xpNeeded === 1, "Falta 1 XP para ascender a Nivel 2");

        const lvl2 = getUserLevelInfo(121);
        assert(lvl2.level === 2 && lvl2.title === 'Explorador de Código', "121 XP asciende a Nivel 2 (Explorador de Código)");

        const lvlMax = getUserLevelInfo(4500);
        assert(lvlMax.level === 9 && lvlMax.nextTier === null, "4500 XP corresponde al Nivel 9 (Leyenda) sin nivel siguiente");

        // 22. Test Cálculo de XP y Bonificación de Primer Intento (calculateLessonXpBreakdown)
        // Caso A: 100% al primer intento (3 preguntas correctas en intento 1)
        window.currentLessonStats = {
          lessonId: 'w2-l1',
          questionsEvaluated: new Set(['q1', 'q2', 'q3']),
          questionsWrongAttempts: { 'q1': 0, 'q2': 0, 'q3': 0 }
        };
        const xpFlawless = calculateLessonXpBreakdown(false);
        assert(xpFlawless.firstTryCount === 3, "3 preguntas acertadas al primer intento");
        assert(xpFlawless.firstTryXp === 75, "75 XP ganados por primer intento (3 * 25)");
        assert(xpFlawless.isFlawless === true, "Detecta perfección impecable (100% al 1er intento)");
        assert(xpFlawless.flawlessBonusXp === 40, "40 XP de bono especial de perfección");
        assert(xpFlawless.totalGainedXp === 165, "Total ganado impecable es 165 XP (50 base + 75 primer intento + 40 bono)");

        // Caso B: Con reintentos (2 al primer intento, 1 con fallo previo)
        window.currentLessonStats = {
          lessonId: 'w2-l1',
          questionsEvaluated: new Set(['q1', 'q2', 'q3']),
          questionsWrongAttempts: { 'q1': 0, 'q2': 1, 'q3': 0 }
        };
        const xpRetries = calculateLessonXpBreakdown(false);
        assert(xpRetries.firstTryCount === 2, "2 preguntas acertadas al primer intento");
        assert(xpRetries.retryCount === 1, "1 pregunta superada tras reintento");
        assert(xpRetries.isFlawless === false, "No es perfección impecable debido a fallo en q2");
        assert(xpRetries.flawlessBonusXp === 0, "Bono de perfección es 0");
        assert(xpRetries.totalGainedXp === 110, "Total ganado con reintento es 110 XP (50 base + 50 primer intento + 10 reintento)");

        // Caso C: Modo repaso de lección ya completada
        const xpReview = calculateLessonXpBreakdown(true);
        assert(xpReview.isReview === true, "Identifica modo repaso");
        assert(xpReview.totalGainedXp === 25, "Repaso otorga +25 XP de práctica");

        // 23. Test Actualización de Indicadores de XP en la Interfaz (updateUserXpDisplay)
        currentUser.xp = 220;
        updateUserXpDisplay();
        const navXpEl = document.getElementById('nav-xp-text');
        const navLvlEl = document.getElementById('nav-level-title');
        const lessonXpEl = document.getElementById('lesson-xp-text');
        assert(navXpEl && navXpEl.textContent === '220 XP', "Badge de navbar muestra 220 XP");
        assert(navLvlEl && navLvlEl.textContent === 'Nivel 2', "Badge de navbar muestra Nivel 2");
        assert(lessonXpEl && lessonXpEl.textContent === '220 XP', "Badge de lección muestra 220 XP");

        // 24. Test Modal de Celebración de Fin de Módulo Semanal (showWeekCelebrationModal)
        assert(window.WEEK_TROPHIES['semana-1'] !== undefined, "Trofeo de Semana 1 definido");
        assert(window.WEEK_TROPHIES['semana-2'] !== undefined, "Trofeo de Semana 2 definido");
        assert(window.WEEK_TROPHIES['semana-1'].badgeTitle.includes("Fundamentos de Python"), "Título de insignia de Semana 1 verificado");

        showWeekCelebrationModal('semana-1');
        const weekModal = document.getElementById('week-completion-modal');
        const weekTitle = document.getElementById('week-celebration-title');
        const weekStatL = document.getElementById('week-stat-lessons');
        assert(weekModal && !weekModal.classList.contains('hidden'), "Modal de celebración semanal se abre y es visible");
        assert(weekTitle && weekTitle.textContent.includes("Semana 1"), "Título del trofeo muestra Semana 1");
        assert(weekStatL && weekStatL.textContent.includes("6"), "Métricas muestran 6 lecciones dominadas");

        dismissWeekCelebrationModal();
        assert(weekModal && weekModal.classList.contains('hidden'), "Modal de celebración semanal se cierra correctamente");

        // 25. Test Modal de Rangos y Jerarquía de Ingeniería UNAL (openLevelInfoModal)
        openLevelInfoModal();
        const lvlModal = document.getElementById('level-info-modal');
        const lvlList = document.getElementById('level-tiers-list');
        assert(lvlModal && !lvlModal.classList.contains('hidden'), "Modal de rangos de ingeniería se abre correctamente");
        assert(lvlList && lvlList.children.length === 9, "Modal de rangos renderiza los 9 niveles de la carrera");

        dismissLevelInfoModal();
        assert(lvlModal && lvlModal.classList.contains('hidden'), "Modal de rangos de ingeniería se cierra correctamente");

        log("¡TODAS LAS PRUEBAS DE FASE 1, 2 Y 3 (XP, NIVELES Y CELEBRACIÓN) PASARON CON ÉXITO!", true);
        console.log("PHASE 1 ALL TESTS PASSED");
        window.TESTS_FINISHED = true;
      } catch (err) {
        log("Error en prueba: " + err.message, false);
        console.error(err);
        window.TESTS_FAILED = true;
      }
    }

    window.addEventListener('DOMContentLoaded', runTests);
  </script>
</body>
</html>
